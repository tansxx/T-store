name: t_store
description: 'A new Flutter project.'

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

#----------------------- PACKAGES -----------------------#
dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  http: ^1.1.0
  intl: ^0.18.1
  logger: ^2.0.1
  url_launcher: ^6.1.12
  flutter_native_splash: ^2.3.2

  #icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1

  # Product Specific

#----------------------- ./ PACKAGES END -----------------------#
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

#----------------------- LOCAL ASSETS -----------------------#
assets:
  - assets/logos/
  - assets/icons/brands/
  - assets/images/

#----------------------- LOCAL ASSETS -----------------------#
fonts:
  - family: Poppins
    fonts:
      - assets: assets/fonts/Poppins-Light.ttf
        weight: 300
      - assets: assets/fonts/Poppins-Regular.ttf
        weight: 400
      - assets: assets/fonts/Poppins-Italic.ttf
        style: italic
      - assets: assets/fonts/Poppins-Medium.ttf
        wegiht: 500
      - assets: assets/fonts/Poppins-MediumItalic.ttf
        style: italic
        weight: 500
      - assets: assets/fonts/Poppins-SemiBold.ttf
        weight: 600
      - assets: assets/fonts/Poppins-Bold.ttf
        weight: 800
